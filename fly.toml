# Fly.io configuration for the OfferMarket API.
#
# This file lives at the repo root because the Dockerfile's build context is
# the monorepo root (it needs the root package.json + lockfile to resolve the
# npm workspace). Deploy with:
#
#   flyctl deploy --config fly.toml --remote-only
#
# CI deploys (see .github/workflows/deploy.yml) authenticate with the
# FLY_API_TOKEN GitHub secret. Generate it with a scoped deploy token:
#   fly tokens create deploy -a offermarket-api
# Do NOT use `flyctl auth token` for CI — it's deprecated, returns your full
# personal token (overprivileged), and can print a malformed value.
#
# Required Fly secrets (set once):
#   flyctl secrets set DATABASE_URL=postgresql://...  (Neon)
#   flyctl secrets set REDIS_URL=redis://...           (Upstash)
#   flyctl secrets set FRONTEND_URL=https://offermarket.nl
#   flyctl secrets set JWT_SECRET=... JWT_REFRESH_SECRET=... ENCRYPTION_KEY=...
#   flyctl secrets set AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... \
#     AWS_REGION=... SES_FROM_EMAIL=... AWS_S3_BUCKET=... \
#     STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... STRIPE_PRICE_ID_INTRODUCTION=... \
#     TWILIO_ACCOUNT_SID=... TWILIO_AUTH_TOKEN=... TWILIO_PHONE_NUMBER=... \
#     KVK_API_KEY=... SENTRY_DSN=... POSTHOG_API_KEY=...

app = "offermarket-api"
primary_region = "ams"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  # Production profile: the API is always on. The API is stateful (Socket.IO
  # long-lived connections) and must not sleep between traffic — the earlier
  # scale-to-zero testing profile cost a multi-second cold start on the first
  # request after every idle period (docs/deployment-readiness.md, 2026-10-11).
  # (Scaling beyond 1 prod machine requires wiring @socket.io/redis-adapter.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness check against the /api/v1/health endpoint. Fly fails the check on
  # any non-200 / redirect, so the endpoint must return 200 outright.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"

# Migrations run in an ephemeral container BEFORE each deploy is promoted, so
# the new code is never live against an old schema. Uses the prisma CLI kept in
# the image's node_modules (see apps/api/Dockerfile note).
[deploy]
  release_command = "npx --no-install prisma migrate deploy"

# Machine resources, pinned so every deploy keeps them (matching the live
# `fly scale` state): Nest + Prisma + Socket.IO idles above the 256 MB default.
# Always-on at this size ≈ $7–8/month.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"