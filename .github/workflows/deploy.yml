name: Deploy

# Builds, tests, and deploys the API to Fly.io on every push to main.
# The web app is NOT deployed here — Vercel deploys it automatically via its
# own GitHub integration (connect the repo in the Vercel dashboard, set env
# vars, and every push to main ships).
#
# Required GitHub secrets:
#   FLY_API_TOKEN   — a scoped deploy token: `fly tokens create deploy -a offermarket-api`
#                     Do NOT use `flyctl auth token` — it's deprecated, returns your full
#                     personal token (overprivileged for CI), and is prone to printing a
#                     malformed value (duplicated prefix / extra chars) that breaks the
#                     secret. A deploy token can only deploy this app + run its migrations.
#   VERCEL_TOKEN    — optional, only if you later switch web deploys to CI
#
# Run tests still happen on PRs via .github/workflows/pr-tests.yml.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./apps/api
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run API tests
        working-directory: ./apps/api
        run: npm test

      # TODO: drop `continue-on-error` once the web test suite is reliable —
      # until then a broken web test silently passes the deploy gate.
      - name: Run web tests
        working-directory: ./apps/web
        run: npm test
        continue-on-error: true

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fly builds the image on its own remote builder from the repo root,
      # so no local Docker build/login is needed.
      #
      # Pinned to a release tag (not @master) so a bad push upstream can't
      # change our deploy behavior. Bump deliberately.
      - name: Deploy API to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --config fly.toml --remote-only --wait-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Run via the same action so flyctl is on PATH — a bare `flyctl` call
      # would fail with "command not found" on the runner.
      - name: Show API status
        uses: superfly/flyctl-actions@1.5
        with:
          args: status --app offermarket-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}