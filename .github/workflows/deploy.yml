name: Deploy

# Builds, tests, and deploys the API to Fly.io on every push to main.
# The web app is NOT deployed here — Vercel deploys it automatically via its
# own GitHub integration (connect the repo in the Vercel dashboard, set env
# vars, and every push to main ships).
#
# Required GitHub secrets:
#   FLY_API_TOKEN   — `flyctl auth token` (API deploy + migrations)
#   VERCEL_TOKEN    — optional, only if you later switch web deploys to CI
#
# Run tests still happen on PRs via .github/workflows/pr-tests.yml.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./apps/api
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run API tests
        working-directory: ./apps/api
        run: npm test

      - name: Run web tests
        working-directory: ./apps/web
        run: npm test
        continue-on-error: true

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fly builds the image on its own remote builder from the repo root,
      # so no local Docker build/login is needed.
      - name: Deploy API to Fly.io
        uses: superfly/flyctl-actions@master
        with:
          args: deploy --config fly.toml --remote-only --wait-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show API status
        run: flyctl status --app offermarket-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}